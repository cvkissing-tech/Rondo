name: Offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -X utf8 -m examples.task_demo
      - run: python -X utf8 -m examples.review_demo
      - run: python -X utf8 -m examples.async_review_demo
